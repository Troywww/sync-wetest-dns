name: Sync Wetest CF IP to Cloudflare DNS

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      max_records:
        description: A records per carrier (overrides env)
        required: false
      prefer_colo:
        description: Colo override, e.g. HKG,SIN
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync DNS
        run: python sync.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DOMAIN_MAP: ${{ secrets.DOMAIN_MAP }}
          MAX_RECORDS: ${{ inputs.max_records || secrets.MAX_RECORDS || '2' }}
          PREFER_COLO: ${{ inputs.prefer_colo || secrets.PREFER_COLO || '' }}
